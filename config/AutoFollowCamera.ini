[AutoFollow]
Enabled=true

; Exponential response in 1/seconds, 0-30. 0 explicitly selects instant snapping.
FollowSpeed=5.0
; Degrees, 0-90. Once following starts, it settles within 0.1 degrees.
FollowDeadzone=8.0

FixedPitch=false
; Degrees, -80 to 80. Also used by explicit recenter; positive looks down.
Pitch=12.0

; AutoOnly, TemporaryOverride, or ManualAllowed
ManualCameraMode=TemporaryOverride
; Seconds of active gameplay, 0-5
ManualOverrideDelay=2.0

RecenterWhileStationary=false
DisableWhileAiming=true
; Follow the animated body's facing during unarmed exploration. Combat and
; backpedalling keep using actor heading. false restores actor-heading-only mode.
FollowBodyFacing=true
; Log camera hook activity and heading samples every two seconds for diagnosis.
DebugLogging=true
; First-person exclusion is mandatory. false is rejected.
DisableInFirstPerson=true

; None or a decimal SKSE input code: keyboard 1-255, mouse 256-265,
; controller 266-281. This observes the binding without consuming it.
RecenterKey=None
