name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset tests
      - run: cmake --build --preset tests
      - run: ctest --preset tests
  plugin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          cmake --preset plugin
      - run: cmake --build --preset plugin --parallel 4
      - run: ctest --preset plugin
      - run: cmake --install build/plugin --config Release --component EasySteer --prefix dist/EasySteer
      - uses: actions/upload-artifact@v4
        with:
          name: EasySteer-1.0.0
          path: dist/EasySteer
